<body>
<main>
  <h1>Qué falla en tu navegador</h1>
  <p class="intro">Esta página no es la web: hace las mismas comprobaciones que la portada, una por una,
     para ver en cuál se rompe. Nada de lo que hace aquí toca tu billetera ni tus claves.</p>

  <noscript>
    <div class="sinscript">
      <b>Tu navegador está bloqueando el JavaScript.</b> Eso ya es el diagnóstico: la portada de KUKIA
      necesita JavaScript para pintar los datos. Revisa la configuración del navegador (bloqueo de
      scripts, extensiones tipo NoScript) y vuelve a entrar.
    </div>
  </noscript>

  <div class="botones">
    <button class="principal" id="b-reparar" type="button">Reparar ahora</button>
    <button id="b-copiar" type="button">Copiar el informe</button>
    <button id="b-recargar" type="button">Recargar en limpio</button>

    <a href="simple.html" style="align-self:center">Versión simple</a>
  </div>

  <div class="veredicto" id="veredicto">Comprobando…</div>
  <ul class="lista" id="lista"></ul>

  <h2>Informe (para copiar y pegar)</h2>
  <pre id="informe">…</pre>
</main>

<script>
(function(){
  'use strict';
  var salida = [];
  var problemas = [];
  var avisos = [];

  function linea(estado, titulo, detalle){
    var li = document.createElement('li');
    var clase = estado === 'ok' ? 'ok' : (estado === 'mal' ? 'mal' : 'ojo');
    li.innerHTML = '<span class="marca ' + clase + '">' +
      (estado === 'ok' ? '✔' : (estado === 'mal' ? '✘' : '!')) + '</span> <b>' +
      titulo.replace(/</g, '&lt;') + '</b>' +
      (detalle ? '<span class="detalle">' + String(detalle).replace(/</g, '&lt;') + '</span>' : '');
    document.getElementById('lista').appendChild(li);
    salida.push((estado === 'ok' ? 'OK   ' : (estado === 'mal' ? 'FALLO ' : 'AVISO ')) + titulo +
                (detalle ? '  |  ' + detalle : ''));
  }
  function muda(que, titulo, detalle){ problemas.push(que); linea('mal', titulo, detalle); }
  function ojo(que, titulo, detalle){ avisos.push(que); linea('ojo', titulo, detalle); }
  function bien(titulo, detalle){ linea('ok', titulo, detalle); }

  function edad(seg){
    if(seg < 90) return seg.toFixed(0) + ' s';
    if(seg < 5400) return (seg / 60).toFixed(0) + ' min';
    if(seg < 172800) return (seg / 3600).toFixed(0) + ' h';
    return (seg / 86400).toFixed(0) + ' dias';
  }

  // Lo que se comprueba es LA PORTADA, no esta pagina: aqui no hay ni video ni
  // sellos, asi que mirarse a si misma daria fallos falsos (y el primer intento
  // de esta pagina los daba: decia "no declara su version" y "no ha cargado
  // nacl" hablando de si misma). Se lee el HTML de la portada tal y como lo
  // sirve el dominio y se prueba con su mismo hash de integridad.
  function datoDeLaPortada(html, nombre){
    var etiquetas = html.match(/<meta[^>]*>/gi) || [];
    if(nombre === 'kukia-build'){
      for(var i = 0; i < etiquetas.length; i++){
        if(/name=["']kukia-build["']/i.test(etiquetas[i])){
          var v = /content=["']([^"']*)["']/i.exec(etiquetas[i]);
          if(v) return v[1];
        }
      }
      return '';
    }
    var scripts = html.match(/<script[^>]*>/gi) || [];
    for(var j = 0; j < scripts.length; j++){
      if(scripts[j].indexOf(nombre) < 0) continue;
      var s = /src=["']([^"']*)["']/i.exec(scripts[j]);
      var g = /integrity=["']([^"']*)["']/i.exec(scripts[j]);
      return { src: s ? s[1] : '', integrity: g ? g[1] : '' };
    }
    return null;
  }

  function probarScript(src, integrity){
    // Se carga de verdad, con el MISMO hash que pide la portada: si el
    // navegador tiene otra copia del fichero, aqui salta igual que alli.
    return new Promise(function(res){
      var s = document.createElement('script');
      s.src = src;
      if(integrity) s.integrity = integrity;
      var terminado = false;
      function fin(r){ if(!terminado){ terminado = true; res(r); } }
      s.onload = function(){ fin('cargado'); };
      s.onerror = function(){ fin('bloqueado'); };
      document.head.appendChild(s);
      setTimeout(function(){ fin('sin-respuesta'); }, 10000);
    });
  }

  function pintarVeredicto(){
    var caja = document.getElementById('veredicto');
    if(problemas.length){
      caja.className = 'veredicto mal';
      caja.innerHTML = '<b>Hay un problema y tiene arreglo desde aquí.</b> ' +
        'Pulsa <b>Reparar ahora</b>: retira la copia vieja que tenga tu navegador y vuelve a cargar. ' +
        'Si despues de eso sigue igual, copia el informe de abajo y mandalo.';
    } else if(avisos.length){
      caja.className = 'veredicto';
      caja.innerHTML = '<b>Funciona, con algún aviso.</b> Los datos llegan; mira los avisos de la lista.';
    } else {
      caja.className = 'veredicto bien';
      caja.innerHTML = '<b>Todo correcto en este navegador.</b> La portada te tiene que funcionar.';
    }
    document.getElementById('informe').textContent =
      'KUKIA · informe desde ' + location.href + '\n' + salida.join('\n');
  }

  // Llega o no llega a una direccion (no-cors: solo interesa si responde).
  function alcanza(url){
    return fetch(url, {mode:'no-cors', cache:'no-store'})
      .then(function(){ return true; })
      .catch(function(){ return false; });
  }

  // Que copia te da TU navegador y a que direcciones llegas. Esto es lo que
  // separa "la web esta mal" de "tu navegador tiene copia vieja o no llega
  // al dominio", que es lo que pasa cuando en un navegador si y en otro no.
  function comprobarCopiaYAlcance(){
    return fetch('./', {cache:'default'})
      .then(function(r){ return r.ok ? r.text() : ''; })
      .catch(function(){ return ''; })
      .then(function(propia){
        var mia = datoDeLaPortada(propia, 'kukia-build');
        return fetch('./?_copia=' + Date.now(), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.text() : ''; })
          .catch(function(){ return ''; })
          .then(function(servidor){
            var suya = datoDeLaPortada(servidor, 'kukia-build');
            if(mia && suya && mia === suya){
              bien('Tu navegador te da la misma copia que el servidor', mia);
            } else if(mia && suya){
              muda('copia-guardada', 'Tu navegador te está dando una COPIA VIEJA',
                   'tu copia dice ' + mia + ' y el servidor tiene ' + suya +
                   '.\nEste es EXACTAMENTE el fallo de "en unos navegadores sí y en otros no":' +
                   ' la copia nueva está en el servidor y no te llega.\nLo arregla el boton Reparar ahora.');
            } else if(suya && !mia){
              muda('copia-sin-version', 'La portada que te llega no declara su version',
                   'el servidor tiene ' + suya + ' y a ti te llega un HTML de hace semanas.\n' +
                   'Lo arregla el boton Reparar ahora.');
            } else {
              ojo('copia', 'No se ha podido leer la version de la portada',
                  'ni de tu copia ni del servidor');
            }
            return null;
          });
      })
      .then(function(){
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          muda('controlador', 'Un service worker viejo está sirviendo TU copia de la web',
               'mientras ese worker siga controlando la pagina, el HTML que ves lo pone el, no el servidor.\n' +
               'Lo arregla el boton Reparar ahora (lo retira y borra su copia).');
        } else {
          bien('Ningun worker viejo controlando esta pagina');
        }
        return fetch('metricas.json?_=' + Date.now(), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null; })
          .catch(function(){ return null; });
      })
      .then(function(cfg){
        var relé = (cfg && cfg.api) ? String(cfg.api).replace(/\/+$/, '') : '';
        // El nombre de cada copia dice el dominio DE VERDAD: asi la pagina
        // sirve tambien desde la copia de GitHub, no solo desde surge.
        var sitios = [
          ['esta web (' + location.hostname + ')', location.origin + '/version.json'],
          ['surge.sh', 'https://kukia-network.surge.sh/version.json'],
          ['GitHub Pages', 'https://lordkukone.github.io/kukia-node/version.json']
        ];
        if(relé) sitios.push(['el relevo de datos', relé + '/api/metricas']);
        return Promise.all(sitios.map(function(p){
          return alcanza(p[1] + '?_=' + Date.now()).then(function(ok){
            return { nombre: p[0], ok: ok };
          });
        }));
      })
      .then(function(res){
        if(!res) return null;
        var abajo = res.filter(function(x){ return !x.ok; }).map(function(x){ return x.nombre; });
        var arriba = res.filter(function(x){ return x.ok; }).map(function(x){ return x.nombre; });
        if(!abajo.length){
          bien('Llegas a todo lo que la web necesita', arriba.join(' · '));
        } else {
          ojo('alcance', 'Tu navegador NO llega a: ' + abajo.join(', '),
              'si llega a: ' + (arriba.join(', ') || 'nada') +
              '\nSi aquí no llega a casi nada, el problema es tu red o tu filtro DNS' +
              ' (VPN, bloqueador de anuncios, DNS con filtro o cortafuegos), no la web.' +
              '\nPrueba en el movil con datos moviles en vez del wifi, o al reves, y compara.');
        }
        return null;
      })
      .catch(function(){});
  }

  function ejecutar(){
    // 0. Antes que nada: tu copia contra la del servidor, y tu alcance.
    comprobarCopiaYAlcance()
      .then(function(){ return null; })
      .catch(function(){ return null; });
    // 1. y 2. La portada que sirve el dominio, y si cuadra con version.json
    fetch('./?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(html){
        if(!html){
          muda('portada', 'No se ha podido leer la portada de este dominio',
               'la direccion ./ no devuelve HTML');
          return null;
        }
        var version = datoDeLaPortada(html, 'kukia-build');
        return fetch('version.json?_=' + Date.now(), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(v){
            var publicado = (v && v.v) ? v.v : '';
            if(!version){
              ojo('portada-sin-version', 'La portada que sirve el dominio no declara su version',
                  'es un HTML viejo (de antes de que la web llevara sello de version)');
            } else if(!publicado){
              ojo('version.json', 'El servidor no dice que version publica',
                  'no se pudo leer version.json en este dominio');
            } else if(version === publicado){
              bien('La portada que sirve este dominio esta al dia', version);
            } else {
              ojo('desincronia', 'La portada y version.json no dicen lo mismo',
                  'portada ' + version + ' · version.json ' + publicado +
                  ' (no impide que la web funcione: solo avisa de una publicacion a medias)');
            }
            // 3. El fichero con hash de integridad, cargado como lo carga la
            //    portada. Es lo que dejaba la web sin datos en GitHub Pages.
            var naclTag = datoDeLaPortada(html, 'nacl.min.js');
            if(!naclTag || !naclTag.src){
              ojo('nacl', 'La portada no pide nacl.min.js', 'no aparece en su HTML');
              return null;
            }
            return probarScript(naclTag.src, naclTag.integrity).then(function(estado){
              if(estado === 'cargado'){
                bien('nacl.min.js se carga con su hash de seguridad', naclTag.src +
                     (naclTag.integrity ? ' · ' + naclTag.integrity.slice(0, 22) + '…' : ' · SIN hash'));
              } else {
                muda('nacl', 'El navegador NO puede cargar nacl.min.js (' + estado + ')',
                     'Sin ese fichero no se pueden verificar los sellos y la portada se queda en' +
                     ' DESCONECTADO, sin datos.\nCausa habitual: el navegador tiene guardada una copia' +
                     ' vieja del fichero y el hash de seguridad no cuadra, asi que lo bloquea en silencio.' +
                     '\nEn la consola sale: "Failed to find a valid digest in the \'integrity\' attribute".' +
                     '\nLo arregla el boton Reparar ahora.');
              }
              return null;
            });
          });
      })
      .then(function(){
        // 4. Service workers y caches (lo que le pasa a ESTE navegador)
        return navigator.serviceWorker && navigator.serviceWorker.getRegistrations
          ? navigator.serviceWorker.getRegistrations() : [];
      })
      .then(function(regs){
        if(regs && regs.length){
          muda('service-worker', 'Tienes ' + regs.length + ' service worker del dominio',
               regs.map(function(r){ return r.active ? r.active.scriptURL : '(inactivo)'; }).join('\n') +
               '\nUn worker viejo sirve su propia copia de la web: es la causa numero uno de "no carga".' +
               '\nLo arregla el boton Reparar ahora.');
        } else { bien('Ningun service worker registrado'); }
        if(!(window.caches && caches.keys)){ bien('Este navegador no usa cache de aplicacion'); return []; }
        return caches.keys();
      })
      .then(function(claves){
        if(claves && claves.length){
          muda('caches', 'Tienes ' + claves.length + ' cache(s) guardada(s) del dominio',
               claves.join(', ') + '\nSe borran con el boton Reparar ahora.');
        } else { bien('Ninguna cache guardada del dominio'); }

        // 5. El relevo publico (los datos en vivo)
        return fetch('metricas.json?_=' + Date.now(), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null; });
      })
      .then(function(cfg){
        if(!cfg || !cfg.api){
          ojo('rele-config', 'No se pudo leer la configuracion del relevo', 'metricas.json');
          return null;
        }
        var api = String(cfg.api).replace(/\/+$/, '');
        return fetch(api + '/api/metricas?_=' + Date.now(), {cache:'no-store'})
          .then(function(r){
            if(!r.ok){ ojo('rele', 'El relevo de datos responde ' + r.status, api); return null; }
            return r.json();
          })
          .then(function(d){
            if(!d) return null;
            var ts = Number(d.ts || 0);
            var seg = ts ? (Date.now() / 1000 - ts) : 1e9;
            if(seg < 180){
              var s = (d.stats || {});
              bien('El relevo responde y los datos son de ahora',
                   'hace ' + edad(seg) + ' · nodos ' + (s.nodos !== undefined ? s.nodos : '?') +
                   ' · tareas ' + (s.tareas_ok !== undefined ? s.tareas_ok : '?'));
            } else {
              ojo('rele-viejo', 'El relevo responde pero el dato es antiguo',
                  'el ultimo dato es de hace ' + edad(seg) + ' (minero parado o Core caido)');
            }
            return null;
          })
          .catch(function(e){
            muda('rele', 'No se puede pedir datos al relevo',
                 api + '\n' + e.name + ': ' + e.message +
                 '\nSi estas detras de un VPN, un filtro DNS o un bloqueador que corte dominios raros,' +
                 ' es lo primero que hay que mirar.');
            return null;
          });
      })
      .catch(function(e){
        muda('excepcion', 'Fallo al comprobar: ' + e.name, e.message);
      })
      .then(function(){
        // 6. La instantanea de respaldo (mismo dominio, sin CORS)
        return fetch('metricas_snapshot.json?_=' + Date.now(), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){
            var ts = d && Number(d.ts || 0);
            if(ts){
              var seg = Date.now() / 1000 - ts;
              bien('Hay instantanea de respaldo del propio dominio', 'la ultima es de hace ' + edad(seg));
            } else { ojo('snapshot', 'No hay instantanea de respaldo legible'); }
          })
          .catch(function(){ ojo('snapshot', 'No se pudo leer la instantanea de respaldo'); });
      })
      .then(function(){
        // 7. Lo que el navegador se guardo de antes
        try {
          var g = localStorage.getItem('kukia_ultimo_dato');
          if(g){
            var d = JSON.parse(g);
            var seg = (Date.now() - Number(d.t || 0)) / 1000;
            bien('Hay un ultimo dato guardado en este navegador', 'de hace ' + edad(seg));
          }
        } catch(e){}
        // 8. Entorno
        var c = navigator.connection || {};
        bien('Entorno', 'navegador: ' + navigator.userAgent +
             '\npantalla: ' + window.innerWidth + 'x' + window.innerHeight +
             ' · ahorro de datos: ' + (c.saveData ? 'SI' : 'no') +
             ' · red: ' + (c.effectiveType || '?') +
             ' · pestana en segundo plano: ' + (document.hidden ? 'SI' : 'no'));
        pintarVeredicto();
      });
  }

  function limpiar(){
    var tareas = [];
    try {
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        tareas.push(navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); }));
        }).catch(function(){}));
      }
    } catch(e){}
    try {
      if(window.caches && caches.keys){
        tareas.push(caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k); }));
        }).catch(function(){}));
      }
    } catch(e){}
    return Promise.all(tareas);
  }

  document.getElementById('b-reparar').addEventListener('click', function(){
    var b = this;
    b.disabled = true;
    b.textContent = 'Reparando...';
    limpiar().then(function(){
      location.replace(location.pathname + '?reparado=' + Date.now());
    });
  });

  document.getElementById('b-recargar').addEventListener('click', function(){
    limpiar().then(function(){ location.reload(); });
  });

  document.getElementById('b-copiar').addEventListener('click', function(){
    var b = this, texto = document.getElementById('informe').textContent;
    function hecho(){ b.textContent = 'Copiado'; setTimeout(function(){ b.textContent = 'Copiar el informe'; }, 2500); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(hecho, function(){ seleccionar(texto); });
    } else { seleccionar(texto); }
    function seleccionar(t){
      var ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); hecho(); } catch(e){ b.textContent = 'Copia a mano el informe'; }
      document.body.removeChild(ta);
    }
  });

  ejecutar();
})();
</script>
</body>
</html>
